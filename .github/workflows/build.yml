name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller
      - name: Build app
        run: pyinstaller modu.spec --noconfirm
      - name: Make dmg
        run: |
          mkdir dmg
          cp -R "dist/모두의 회의록.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "모두의 회의록" -srcfolder dmg -ov -format UDZO ModuMeeting-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ModuMeeting-mac.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-win.txt pyinstaller
      - name: Build app
        run: pyinstaller modu.spec --noconfirm
      - name: Make installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ModuMeeting-windows-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mac/ModuMeeting-mac.dmg
            windows/ModuMeeting-windows-setup.exe
