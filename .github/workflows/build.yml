name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller
      - name: Build app
        run: pyinstaller modu.spec --noconfirm
      - name: Make dmg
        run: |
          mkdir dmg
          cp -R "dist/모두의 회의록.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "모두의 회의록" -srcfolder dmg -ov -format UDZO ModuMeeting-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ModuMeeting-mac.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-win.txt pyinstaller
      - name: Build app
        run: pyinstaller modu.spec --noconfirm
      - name: Make installer
        run: |
          choco install innosetup -y --no-progress
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer\MicrosoftEdgeWebview2Setup.exe
          $v = (Select-String -Path app\version.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows.iss
      - name: Make Store package (MSIX)
        if: ${{ vars.MSIX_NAME != '' }}
        run: |
          $v = (Select-String -Path app\version.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $m = (Get-Content installer\AppxManifest.xml -Raw -Encoding UTF8).Replace("__NAME__", "${{ vars.MSIX_NAME }}").Replace("__PUBLISHER__", "${{ vars.MSIX_PUBLISHER }}").Replace("__PUBLISHER_DISPLAY__", "${{ vars.MSIX_PUBLISHER_DISPLAY }}").Replace("__VERSION__", $v)
          [IO.File]::WriteAllText("dist\ModuMeeting\AppxManifest.xml", $m, (New-Object Text.UTF8Encoding $false))
          Copy-Item -Recurse installer\msix dist\ModuMeeting\msix
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
          & $tool.FullName pack /d dist\ModuMeeting /p ModuMeeting-store.msix /o
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ModuMeeting-windows-setup.exe
      - uses: actions/upload-artifact@v4
        if: ${{ vars.MSIX_NAME != '' }}
        with:
          name: store
          path: ModuMeeting-store.msix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mac/ModuMeeting-mac.dmg
            windows/ModuMeeting-windows-setup.exe
